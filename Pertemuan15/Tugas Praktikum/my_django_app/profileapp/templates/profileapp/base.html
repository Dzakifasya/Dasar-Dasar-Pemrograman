{% load static %}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Profile Saya - Tugas DDP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap LOCAL -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Font Awesome (boleh CDN, tidak mempengaruhi nilai DDP) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .bg-teal { background-color: #000000 !important; }
        .carousel-item img { height: 400px; object-fit: cover; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        footer { margin-top: auto; }
    </style>
</head>
<body>

<!-- CAROUSEL HEADER -->
<div id="headerCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
        <button data-bs-target="#headerCarousel" data-bs-slide-to="0" class="active"></button>
        <button data-bs-target="#headerCarousel" data-bs-slide-to="1"></button>
        <button data-bs-target="#headerCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="{% static 'img/7.jpeg' %}" class="w-100">
            <div class="carousel-caption">
                <h5>Selamat Datang</h5>
                <p>Website Profile Pribadi</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="{% static 'img/5.jpeg' %}" class="w-100">
        </div>
        <div class="carousel-item">
            <img src="{% static 'img/8.jpeg' %}" class="w-100">
        </div>
    </div>

    <button class="carousel-control-prev" data-bs-target="#headerCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#headerCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-teal shadow sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">Profile</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="nav" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'gallery' %}">Gallery</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container my-5">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="bg-teal text-white py-3">
    <div class="container">
        <small>Created by <b>Dzaki Fasya</b> © 2026</small>
    </div>
</footer>

<!-- Bootstrap JS LOCAL -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
